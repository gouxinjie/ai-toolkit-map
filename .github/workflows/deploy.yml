name: Deploy to Aliyun ECS

# 触发时机：推送到 master 分支时部署
on:
  push:
    branches: [master]
  workflow_dispatch:      # 支持手动触发

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 部署到阿里云 ECS
        uses: easingthemes/ssh-deploy@v4.1.0
        with:
          # SSH 私钥（GitHub Secrets 中配置）
          SSH_PRIVATE_KEY: ${{ secrets.ECS_SSH_KEY }}
          # ECS 服务器信息
          REMOTE_HOST: ${{ secrets.ECS_HOST }}
          REMOTE_USER: ${{ secrets.ECS_USER }}
          REMOTE_PORT: ${{ secrets.ECS_PORT }}
          # 部署目标目录（其余 Nginx 项目不受影响）
          TARGET: /var/www/ai-toolkit-map
          # 需要同步的源目录
          SOURCE: ./
          # 排除不需要上传的文件/目录
          EXCLUDE: ".github/,/.git/,/.gitignore,README.md,docs/"
          # --delete: 部署前先清空目标目录，避免残留旧文件
          # 注意：不要在这里写 -o/StrictHostKeyChecking（那是 ssh 参数，
          #       ssh-deploy 已自动通过 --rsh 附带，写在 rsync 末尾会报错）
          ARGS: "-avz --delete"
