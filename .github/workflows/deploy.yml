name: Deploy to Aliyun ECS

# 触发时机：推送到 master 分支时部署
on:
  push:
    branches: [master]
  workflow_dispatch:      # 支持手动触发

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      # 用 webfactory/ssh-agent 加载私钥。
      # 它专门处理多行 OPENSSH 私钥的换行符，能避免 "error in libcrypto" 问题
      - name: 加载 SSH 私钥
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.ECS_SSH_KEY }}

      - name: 部署到阿里云 ECS
        run: |
          rsync -avz --delete \
            -e "ssh -o StrictHostKeyChecking=no -p ${{ secrets.ECS_PORT }}" \
            --exclude='.github/' \
            --exclude='.git/' \
            --exclude='.gitignore' \
            --exclude='README.md' \
            --exclude='docs/' \
            ./ \
            ${{ secrets.ECS_USER }}@${{ secrets.ECS_HOST }}:/var/www/ai-toolkit-map/
