<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 工具全景图 · 从编程助手到能力全景</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5fbf7; --bg2:#ecfdf5; --surface:#ffffff; --ink:#0f172a; --ink2:#475569; --ink3:#94a3b8;
  --line:#e2e8f0; --line2:#f1f5f9;
  --green:#10b981; --green-d:#059669; --green-l:#d1fae5; --green-ll:#ecfdf5;
  --blue:#3b82f6; --blue-l:#dbeafe;
  --purple:#8b5cf6; --purple-l:#ede9fe;
  --orange:#f97316; --orange-l:#ffedd5;
  --pink:#ec4899; --cyan:#06b6d4; --red:#ef4444;
  --code-bg:#0f172a; --code-ink:#e2e8f0; --code-com:#64748b; --code-hl:#fbbf24;
  --body:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,'PingFang SC','Microsoft YaHei',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
  --latin:'Inter',var(--body);
}
[data-theme="dark"]{
  --bg:#0f172a; --bg2:#1e293b; --surface:#111827; --ink:#e2e8f0; --ink2:#94a3b8; --ink3:#64748b;
  --line:#1f2b3d; --line2:#1a2332;
  --green:#34d399; --green-d:#10b981; --green-l:#065f46; --green-ll:#0b2e24;
  --blue:#60a5fa; --blue-l:#1e3a5f;
  --purple:#a78bfa; --purple-l:#3b2f63;
  --orange:#fb923c; --orange-l:#5a3520;
  --pink:#f472b6; --cyan:#22d3ee; --red:#f87171;
  --code-bg:#0b1120; --code-ink:#e2e8f0; --code-com:#475569; --code-hl:#fbbf24;
}
[data-theme="dark"] body{background:var(--bg);color:var(--ink)}
[data-theme="dark"] .topbar{background:rgba(15,23,42,.9)}
[data-theme="dark"] .mast-badges i{background:linear-gradient(180deg,#1e293b,#0b2e24);box-shadow:0 1px 2px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.06)}
[data-theme="dark"] .mast-badges i:hover{border-color:var(--green);box-shadow:0 6px 14px -6px rgba(16,185,129,.35),inset 0 1px 0 rgba(255,255,255,.06)}
[data-theme="dark"] .stat:hover{background:var(--surface)}
[data-theme="dark"] .term{box-shadow:0 30px 70px -22px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.04) inset}
[data-theme="dark"] .search input::placeholder{color:#475569}
[data-theme="dark"] .side-foot b{color:var(--green)}
/* 深色下 color-mix 的 #fff 混合基准统一改用 surface，避免高亮区过亮 */
[data-theme="dark"] .sec-tt .tag,
[data-theme="dark"] .expand-toggle:hover,
[data-theme="dark"] .tool-head:hover,
[data-theme="dark"] .tool.open .tool-head,
[data-theme="dark"] .tool-head:active,
[data-theme="dark"] .tool-head:hover .chev,
[data-theme="dark"] .casebox,
[data-theme="dark"] th,
[data-theme="dark"] tbody tr:hover,
[data-theme="dark"] .decide-h,
[data-theme="dark"] .d-row:hover,
[data-theme="dark"] .top10-h,
[data-theme="dark"] .top10 li:hover,
[data-theme="dark"] .rk-tag,
[data-theme="dark"] .proto-chips i,
[data-theme="dark"] .verdict{background:var(--surface)}
[data-theme="dark"] .verdict{background:linear-gradient(135deg,color-mix(in srgb,var(--acc) 12%,var(--surface)),var(--surface) 60%)}
[data-theme="dark"] th,.casebox,.decide-h,.top10-h,.rk-tag,.proto-chips i{border-color:color-mix(in srgb,var(--acc) 30%,var(--line))}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:var(--body);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.7;overflow-x:hidden;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none}
img{max-width:100%;display:block}
.progress{position:fixed;top:0;left:0;height:2px;width:0;background:var(--green);z-index:200;transition:width .1s}

/* topbar (mobile) */
.topbar{display:none;position:fixed;top:0;left:0;right:0;height:54px;z-index:120;background:rgba(255,255,255,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);align-items:center;gap:12px;padding:0 16px}
.burger{width:38px;height:38px;border-radius:8px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:4px}
.burger span{display:block;width:18px;height:2px;background:var(--ink)}
.tb-brand{font-size:15px;font-weight:700;color:var(--ink)}
.tb-brand em{color:var(--green);font-style:normal}
.scrim{position:fixed;inset:0;background:rgba(15,23,42,.4);z-index:110;opacity:0;pointer-events:none;transition:.3s}
.scrim.on{opacity:1;pointer-events:auto}

/* layout */
.layout{position:relative;display:grid;grid-template-columns:248px minmax(0,1fr)}

/* sidebar */
.side{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--surface);border-right:1px solid var(--line);padding:22px 16px 18px;scrollbar-width:thin}
.side::-webkit-scrollbar{width:4px}.side::-webkit-scrollbar-thumb{background:var(--line);border-radius:2px}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:24px}
.brand .logo{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--green),var(--green-d));display:grid;place-items:center;color:#fff;font-weight:700;font-size:16px;box-shadow:0 4px 10px -3px rgba(16,185,129,.4)}
.brand .text{font-size:14.5px;font-weight:700;letter-spacing:.5px}
.brand .text em{color:var(--green);font-style:normal}
.brand .text small{display:block;font-family:var(--mono);font-size:9px;letter-spacing:1.5px;color:var(--ink3);font-weight:400;margin-top:2px}
.search{position:relative;margin-bottom:18px}
.search-ico{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:#94a3b8;pointer-events:none;transition:color .2s}
.search:focus-within .search-ico{color:#7c3aed}
.search input{width:100%;padding:9px 12px 9px 36px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-family:inherit;font-size:13px;color:var(--ink);outline:none;transition:border-color .2s,box-shadow .2s,background .2s;box-shadow:0 1px 2px rgba(15,23,42,.04)}
.search input::placeholder{color:#94a3b8;letter-spacing:.2px}
.search input:hover{border-color:#cbd5e1}
.search input:focus{border-color:#7c3aed;background:var(--surface);box-shadow:0 0 0 3px rgba(124,58,237,.14),0 4px 12px -6px rgba(124,58,237,.30)}

.nav{display:flex;flex-direction:column;gap:1px}
.nav-label{font-family:var(--mono);font-size:10px;letter-spacing:1.5px;color:var(--ink3);margin:14px 8px 6px;text-transform:uppercase}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:7px;color:var(--ink2);font-size:13px;font-weight:500;border-left:2px solid transparent;transition:.18s}
.nav a .n{font-family:var(--latin);font-weight:600;font-size:10.5px;color:var(--ink3);width:20px;text-align:center;transition:.18s}
.nav a:hover{background:var(--bg2);color:var(--ink)}
.nav a:hover .n{color:var(--green)}
.nav a.act{background:var(--green-ll);color:var(--green-d);border-left-color:var(--green);font-weight:600}
.nav a.act .n{color:var(--green-d)}
.side-foot{margin-top:auto;padding-top:18px;border-top:1px dashed var(--line);font-family:var(--mono);font-size:11.5px;color:var(--ink2);line-height:2.1}
.side-foot b{color:var(--green)}
.theme-toggle{display:flex;justify-content:space-between;align-items:center;width:100%;margin-top:8px;padding:8px 12px;border-radius:10px;background:var(--bg2);cursor:pointer;border:1px solid var(--line);transition:.25s;color:var(--ink2);font-size:12px;font-weight:500}
.theme-toggle:hover{background:var(--green-ll);border-color:var(--green-l);color:var(--green-d)}
.theme-toggle .tt-lab{display:flex;align-items:center;gap:8px;line-height:1}
.theme-toggle .tt-ico{width:16px;height:16px;display:grid;place-items:center;opacity:.85}
.theme-toggle .switch{position:relative;width:34px;height:19px;border-radius:99px;background:var(--line);transition:.3s;flex-shrink:0;border:1px solid var(--line2)}
.theme-toggle .switch::after{content:"";position:absolute;top:1px;left:1px;width:15px;height:15px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(15,23,42,.3);transition:.3s cubic-bezier(.4,0,.2,1)}
[data-theme="dark"] .theme-toggle .switch{background:var(--green)}
[data-theme="dark"] .theme-toggle .switch::after{transform:translateX(15px);background:#0f172a}
[data-theme="dark"] .theme-toggle:hover{background:var(--green-ll);color:var(--green-d)}

/* main */
.main{padding:0 40px 60px;min-width:0}

/* hero */
.mast{display:grid;grid-template-columns:1.1fr .9fr;gap:32px;align-items:center;padding:48px 0 16px}
.kicker{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;letter-spacing:2px;color:var(--green-d);font-weight:600;margin-bottom:18px}
.kicker .dot{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.6;transform:scale(.85)}}
.mast h1{font-weight:700;font-size:clamp(32px,3.6vw,46px);line-height:1.3;letter-spacing:-.5px;color:var(--ink)}
.mast h1 .hl{color:var(--green)}
.lede{margin-top:18px;color:var(--ink2);font-size:15px;max-width:520px;line-height:1.85}
.lede code{font-family:var(--mono);font-size:12.5px;background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:1px 6px;color:var(--green-d)}
.mast-badges{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.mast-badges i{font-style:normal;font-size:11.5px;padding:7px 14px;border:1px solid rgba(16,185,129,.18);background:linear-gradient(180deg,#fff,#ecfdf5);border-radius:99px;color:var(--ink2);box-shadow:0 1px 2px rgba(15,23,42,.04),inset 0 1px 0 #fff;cursor:default;transition:transform .18s,box-shadow .18s,border-color .18s;display:inline-flex;align-items:center;gap:6px}
.mast-badges i b{color:var(--green-d);font-weight:700}
.mast-badges .tick{color:var(--green);font-size:10px;opacity:.9;display:inline-block}
.mast-badges i:hover{transform:translateY(-1px);border-color:var(--green);box-shadow:0 6px 14px -6px rgba(16,185,129,.35),inset 0 1px 0 #fff}
.hero-term{position:relative;display:flex;align-items:center;justify-content:center;min-height:320px}
.term{position:relative;width:100%;max-width:520px;background:var(--code-bg);border-radius:14px;box-shadow:0 30px 70px -22px rgba(15,23,42,.45),0 0 0 1px rgba(255,255,255,.04) inset;padding:0 0 22px}
.term::before{content:"LIVE ●";position:absolute;top:-12px;right:18px;font-family:var(--mono);font-size:10px;letter-spacing:2px;color:#34d399;background:var(--code-bg);border:1px solid #1e293b;padding:3px 10px;border-radius:99px}
.term-bar{display:flex;align-items:center;gap:7px;padding:14px 18px;border-bottom:1px solid #1e293b}
.term-bar i{width:11px;height:11px;border-radius:50%}
.term-bar i:nth-child(1){background:#ff5f57}
.term-bar i:nth-child(2){background:#febc2e}
.term-bar i:nth-child(3){background:#28c840}
.term-bar em{font-style:normal;font-family:var(--mono);font-size:11px;color:#64748b;margin-left:8px}
.term-body{padding:18px 22px 6px;font-family:var(--mono);font-size:13px;line-height:2.05;min-height:190px;color:#cbd5e1}
.tl.cmd{color:#fff}
.tl.cmd::before{content:"$ ";color:#34d399}
.tl.ok{color:#34d399}
.tl.go{color:#fbbf24}
.cur{display:inline-block;width:8px;height:16px;background:#34d399;vertical-align:-2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:24px 0 40px}
.stat{display:flex;align-items:center;gap:14px;padding:18px 20px;position:relative;transition:.2s;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 4px 14px -10px rgba(15,23,42,.1)}
.stat + .stat{border-left:none}
.stat:hover{background:#fbfdfc}
.stat-ico{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;flex-shrink:0;box-shadow:0 6px 14px -5px rgba(15,23,42,.18)}
.stat-ico svg{width:18px;height:18px;color:#fff;stroke:#fff}
.stat.s1 .stat-ico{background:linear-gradient(135deg,#10b981,#059669)}
.stat.s2 .stat-ico{background:linear-gradient(135deg,#3b82f6,#2563eb)}
.stat.s3 .stat-ico{background:linear-gradient(135deg,#8b5cf6,#7c3aed)}
.stat.s4 .stat-ico{background:linear-gradient(135deg,#f97316,#ea580c)}
.stat-body{display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .num{font-family:var(--latin);font-weight:700;font-size:26px;color:var(--ink);line-height:1.1;letter-spacing:-1px}
.stat .lab{font-size:12.5px;color:var(--ink2);font-weight:500}
.stat .lab b{display:block;font-family:var(--mono);font-size:11px;color:var(--ink3);letter-spacing:1px;font-weight:600;text-transform:uppercase;margin-top:1px}

/* section */
.sec{padding:0;scroll-margin-top:72px}
.sec:first-child{margin-top:28px}
.sec:not(:first-child){margin-top:68px}
.sec-head{position:relative;display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap;margin-bottom:26px;padding:0 0 20px 14px}
.sec-head::before{content:"";position:absolute;left:0;top:0;bottom:14px;width:4px;border-radius:4px;background:linear-gradient(180deg,var(--acc),transparent)}
.sec-head::after{content:"";position:absolute;left:14px;right:0;bottom:0;height:1.5px;border-radius:2px;background:linear-gradient(90deg,var(--acc),color-mix(in srgb,var(--acc) 30%,transparent) 50%,transparent);opacity:.45}
.sec-num{font-family:var(--latin);font-weight:800;font-size:clamp(48px,5.5vw,72px);line-height:.9;color:transparent;-webkit-text-stroke:1.5px var(--acc);opacity:.55;letter-spacing:-2px}
.sec-tt{display:flex;gap:12px;align-items:center;flex:1;min-width:240px}
.sec-tt h2{font-weight:700;font-size:22px;letter-spacing:-.3px;color:var(--ink)}
.sec-tt .tag{display:inline-block;font-size:11px;padding:3px 8px;background:color-mix(in srgb,var(--acc) 12%,#fff);color:var(--acc);border-radius:5px;font-weight:600;margin-left:4px}
.sec-tt p{font-size:12.5px;color:var(--ink2);margin-top:4px}
.sec-ctrl{display:flex;gap:6px}
.expand-toggle{display:flex;align-items:center;gap:6px;padding:6px 12px;font-size:11.5px;color:var(--ink2);border:1px solid var(--line);border-radius:8px;background:var(--surface);transition:.18s}
.expand-toggle:hover{color:var(--acc);border-color:color-mix(in srgb,var(--acc) 40%,var(--line));background:color-mix(in srgb,var(--acc) 5%,#fff)}
.expand-toggle:active{transform:translateY(1px)}
.expand-toggle svg{width:13px;height:13px;flex-shrink:0}

/* tool card */
.tool{background:var(--surface);border:1px solid var(--line);border-radius:13px;margin-bottom:10px;transition:.25s;overflow:hidden;position:relative}
.tool::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--acc);opacity:0;transition:.25s}
.tool:hover{box-shadow:0 10px 28px -14px rgba(15,23,42,.16);transform:translateY(-1px);border-color:transparent}
.tool:hover::before{opacity:1}
.tool.hide{display:none}
.tool-head{width:100%;display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:14px;padding:14px 18px;text-align:left;cursor:pointer;transition:background .25s}
.tool-head:hover,.tool.open .tool-head{background:color-mix(in srgb,var(--acc) 5%,#fff)}
.tool-head:active{background:color-mix(in srgb,var(--acc) 9%,#fff)}
.tool-head:focus-visible{outline:2px solid var(--acc);outline-offset:-2px}
.tool-ico{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;font-family:var(--latin);font-weight:700;font-size:14px;color:#fff;background:linear-gradient(135deg,color-mix(in srgb,var(--acc) 100%,#fff 12%) 0%,var(--acc) 100%);box-shadow:0 3px 8px -2px color-mix(in srgb,var(--acc) 30%,transparent);flex-shrink:0}
.tool-head:hover .tool-ico{transform:none;box-shadow:0 3px 8px -2px color-mix(in srgb,var(--acc) 30%,transparent)}
.tool-name{font-size:15px;font-weight:600;color:var(--ink);line-height:1.35;min-width:0}
.tool-name em{display:block;font-style:normal;font-weight:400;font-size:12px;color:var(--ink3);margin-top:2px;transition:color .2s}
.tool-head:hover .tool-name em{color:var(--ink2)}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
.chip{font-style:normal;font-family:var(--mono);font-size:10px;letter-spacing:.3px;padding:3px 9px;border-radius:99px;border:1px solid;white-space:nowrap;box-shadow:inset 0 1px 0 rgba(255,255,255,.7);transition:transform .18s,box-shadow .18s,border-color .18s;line-height:1.6}
.chip:hover{transform:translateY(-1px);box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 2px 5px -2px rgba(15,23,42,.14)}
.k-free{color:#047857;border-color:#a7f3d0;background:#ecfdf5}
.k-paid{color:#b45309;border-color:#fed7aa;background:#fff7ed}
.k-oss{color:#155e75;border-color:#a5f3fc;background:#ecfeff}
.k-kind{color:#64748b;border-color:#e2e8f0;background:#f1f5f9}
.chev{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:15px;line-height:1;color:var(--ink3);background:var(--line2);flex-shrink:0;transition:transform .35s cubic-bezier(.2,.8,.2,1),color .2s,background .2s,box-shadow .2s}
.tool-head:hover .chev{color:var(--acc);background:color-mix(in srgb,var(--acc) 10%,#fff)}
.tool.open .chev{color:#fff;background:var(--acc);box-shadow:none;transform:rotate(90deg)}
.tool-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s cubic-bezier(.4,0,.2,1)}
.tool.open .tool-body{grid-template-rows:1fr}
.tool-inner{overflow:hidden;min-height:0}
.tool-pad{padding:4px 22px 22px;border-top:1px dashed var(--line);margin-top:0}
.sub{margin-top:14px}
.sub h5{font-size:12.5px;letter-spacing:1.5px;color:var(--acc);font-weight:700;margin-bottom:8px;text-transform:uppercase;font-family:var(--mono)}
.sub p{font-size:13.5px;color:var(--ink);line-height:1.75}
.sub ul{margin:4px 0 0 4px;list-style:none}
.sub ul li{font-size:13.5px;color:var(--ink);padding-left:18px;position:relative;margin-bottom:5px;line-height:1.7}
.sub ul li::before{content:"▸";position:absolute;left:0;color:var(--acc);font-weight:700}
.casebox{background:color-mix(in srgb,var(--acc) 9%,#fff);border:1px solid color-mix(in srgb,var(--acc) 25%,#fff);border-left:3px solid var(--acc);border-radius:9px;padding:12px 14px}
.casebox b{color:var(--acc)}
kbd{font-family:var(--mono);font-size:11px;background:#f1f5f9;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:1px 5px;color:var(--ink)}

/* code */
.code{background:var(--code-bg);border-radius:9px;overflow:hidden;margin-top:6px}
.code-bar{display:flex;align-items:center;justify-content:space-between;padding:7px 14px;border-bottom:1px solid #1e293b}
.code-bar span{font-family:var(--mono);font-size:10.5px;letter-spacing:1.5px;color:#64748b;text-transform:uppercase}
.copy{font-family:var(--mono);font-size:10.5px;color:#94a3b8;background:#1e293b;border:1px solid #334155;border-radius:5px;padding:2px 10px;transition:.2s}
.copy:hover{color:#fff;border-color:var(--acc)}
.code pre{padding:12px 16px;overflow-x:auto;scrollbar-width:thin}
.code code{font-family:var(--mono);font-size:12.4px;line-height:1.8;color:var(--code-ink);white-space:pre}
.cm{color:var(--code-com)}.hl2{color:var(--code-hl)}.ok{color:#34d399}

/* table */
.tbl-wrap{overflow-x:auto;margin:18px 0 8px;border:1px solid var(--line);border-radius:13px;background:var(--surface);box-shadow:0 6px 18px -12px rgba(15,23,42,.08)}
table{width:100%;border-collapse:collapse;min-width:680px}
th{font-family:var(--mono);font-size:12.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--acc);background:color-mix(in srgb,var(--acc) 9%,#fff);padding:11px 14px;text-align:left;border-bottom:1px solid color-mix(in srgb,var(--acc) 25%,#fff);white-space:nowrap;font-weight:800}
td{font-size:13px;padding:10px 14px;border-bottom:1px solid var(--line);color:var(--ink);vertical-align:top}
tr:last-child td{border-bottom:none}
tbody tr{transition:.18s}
tbody tr:hover{background:color-mix(in srgb,var(--acc) 7%,#fff)}
td b{color:var(--ink)}
.tbl-cap{font-family:var(--mono);font-size:12.5px;color:var(--ink3);letter-spacing:1px;margin:6px 2px 0}

/* decide */
.decide{margin:18px 0 8px;border:1px solid var(--line);border-radius:13px;background:var(--surface);overflow:hidden;box-shadow:0 6px 18px -12px rgba(15,23,42,.08)}
.decide-h{font-family:var(--mono);font-size:11px;letter-spacing:2px;padding:10px 16px;background:color-mix(in srgb,var(--acc) 9%,#fff);border-bottom:1px solid color-mix(in srgb,var(--acc) 25%,#fff);color:var(--acc);font-weight:700}
.d-row{display:grid;grid-template-columns:1fr auto 1.2fr;gap:14px;align-items:center;padding:11px 16px;border-bottom:1px dashed var(--line);font-size:13.5px;transition:.2s}
.d-row:last-child{border-bottom:none}
.d-row:hover{background:color-mix(in srgb,var(--acc) 4%,#fff);padding-left:22px}
.d-row .need{color:var(--ink2)}
.d-row .arr{color:var(--acc);display:inline-flex;align-items:center}
.d-row .arr svg{width:18px;height:18px;flex-shrink:0}
.d-row .pick b{color:var(--acc)}

/* verdict */
.verdict{margin:18px 0 8px;background:linear-gradient(135deg,color-mix(in srgb,var(--acc) 9%,#fff),#fff 60%);border:1px solid color-mix(in srgb,var(--acc) 25%,#fff);border-left:4px solid var(--acc);border-radius:12px;padding:14px 18px}
.verdict h4{font-family:var(--mono);font-size:11px;letter-spacing:2px;color:var(--acc);margin-bottom:8px;text-transform:uppercase}
.verdict p{font-size:13.5px;color:var(--ink);margin-bottom:4px}

/* rank */
.rank{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:18px 0 8px}
.rank-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;transition:.25s;box-shadow:0 6px 18px -12px rgba(15,23,42,.08)}
.rank-card:hover{border-color:color-mix(in srgb,var(--acc) 35%,#fff);box-shadow:0 10px 24px -14px color-mix(in srgb,var(--acc) 25%,transparent)}
.rank-card h4{font-size:13.5px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.rank-card h4 i{font-style:normal;font-family:var(--mono);font-size:9.5px;color:var(--ink3);font-weight:500;letter-spacing:1.5px;text-transform:uppercase}
.rb{display:grid;grid-template-columns:88px 1fr 30px;align-items:center;gap:10px;margin-bottom:8px;font-size:12.5px}
.rb b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.rb .track{height:12px;background:var(--bg2);border-radius:3px;overflow:hidden;position:relative}
.rb .track i{display:block;height:100%;width:var(--w);border-radius:3px;transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.rb em{font-style:normal;font-family:var(--latin);font-weight:700;font-size:11px;color:var(--ink3);text-align:right}
.rb .track i{background:linear-gradient(90deg,var(--green),var(--green-d))}
.rb.m1 .track i{background:linear-gradient(90deg,#fbbf24,#f59e0b)}
.rb.m2 .track i{background:linear-gradient(90deg,#cbd5e1,#94a3b8)}
.rb.m3 .track i{background:linear-gradient(90deg,#fb923c,#ea580c)}

/* top10 */
.top10-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:18px 0 8px}
.top10-col{background:var(--surface);border:1px solid var(--line);border-radius:13px;overflow:hidden;transition:.25s;box-shadow:0 6px 18px -12px rgba(15,23,42,.08)}
.top10-col:hover{box-shadow:0 12px 28px -14px rgba(15,23,42,.16)}
.top10-h{font-family:var(--mono);font-size:12.5px;font-weight:600;letter-spacing:1.2px;padding:13px 18px;background:var(--acc);color:#fff;display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid color-mix(in srgb,var(--acc) 25%,#fff)}
.top10-h small{font-weight:500;color:#fff;font-size:10.5px;letter-spacing:.5px;text-transform:none;opacity:.85}
.top10{list-style:none}
.top10 li{display:grid;grid-template-columns:36px 1fr auto;gap:12px;align-items:center;padding:11px 16px;border-bottom:1px dashed var(--line);transition:.2s}
.top10 li:last-child{border-bottom:none}
.top10 li:hover{background:color-mix(in srgb,var(--acc) 7%,#fff);padding-left:20px}
.rk{font-family:var(--latin);font-weight:700;font-size:18px;color:var(--ink3);line-height:1}
li.r1 .rk{color:#f59e0b}li.r2 .rk{color:#94a3b8}li.r3 .rk{color:#ea580c}
.rk-body{min-width:0}
.rk-body b{font-size:13.5px;color:var(--ink)}
.rk-body em{display:block;font-style:normal;font-size:11px;color:var(--ink3);margin:2px 0 4px;line-height:1.5}
.rk-body code{font-family:var(--mono);font-size:10.5px;background:var(--code-bg);color:#a7f3d0;padding:3px 8px;border-radius:5px;display:inline-block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;transition:.2s}
.rk-body code:hover{color:#fff;box-shadow:0 0 0 2px rgba(16,185,129,.45)}
.rk-body code.copied{background:#064e3b;color:#34d399}
.rk-tag{font-family:var(--mono);font-size:9.5px;letter-spacing:1px;padding:3px 8px;border-radius:99px;border:1px solid color-mix(in srgb,var(--acc) 25%,#fff);color:var(--acc);background:color-mix(in srgb,var(--acc) 9%,#fff);white-space:nowrap}
.top10-note{font-family:var(--mono);font-size:10.5px;color:var(--ink3);padding:10px 16px;background:var(--bg2);border-top:1px solid var(--line);line-height:1.9}
.top10-note code{font-family:var(--mono);font-size:10px;background:var(--code-bg);color:#a7f3d0;padding:2px 7px;border-radius:4px;cursor:pointer}
.top10-note code:hover{color:#fff}
.top10-note code.copied{background:#064e3b;color:#34d399}

/* flow */
.flow{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:10px;align-items:stretch;margin:14px 0}
.flow-box{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--acc);border-radius:10px;padding:14px 16px;transition:.25s;display:flex;flex-direction:column;justify-content:flex-start;min-height:96px}
.flow-box:hover{transform:translateY(-3px);box-shadow:0 10px 22px -12px rgba(15,23,42,.25)}
.flow-box h4{font-family:var(--latin);font-size:13px;font-weight:700;margin-bottom:6px;letter-spacing:.3px;color:var(--ink)}
.flow-box p{font-size:12.5px;color:var(--ink);line-height:1.7;margin-bottom:8px}
.flow-box .ex{font-family:var(--mono);font-size:11px;color:var(--acc);margin-top:auto;display:block;letter-spacing:.2px}
.flow-arr{display:flex;flex-direction:column;justify-content:center;gap:7px;min-width:58px;align-self:stretch;padding:0 2px}
.flow-arr i{display:block;height:3px;width:100%;background-image:linear-gradient(90deg,var(--acc) 55%,transparent 0);background-size:11px 3px;background-repeat:repeat-x;border-radius:1px;opacity:.9}
.flow-arr i:nth-child(2){opacity:.55}
.flow-arr em{font-style:normal;font-family:var(--mono);font-size:9.5px;color:var(--ink3);text-align:center;letter-spacing:.5px;text-transform:uppercase;line-height:1;margin-top:-1px}
@keyframes dash{to{background-position:28px 0}}
.proto-chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px}
.proto-chips i{font-style:normal;font-family:var(--mono);font-size:10.5px;padding:4px 10px;border-radius:6px;background:color-mix(in srgb,var(--acc) 9%,#fff);border:1px solid color-mix(in srgb,var(--acc) 25%,#fff);color:var(--acc)}
.flow-chips{grid-column:1/-1;margin:12px 0 0;padding-top:12px;border-top:1px dashed color-mix(in srgb,var(--acc) 30%,var(--line))}

/* arch */
.arch{margin:0;position:relative}
.arch::before{content:"";position:absolute;left:118px;top:14px;bottom:14px;width:2px;background:repeating-linear-gradient(180deg,var(--line) 0 7px,transparent 7px 13px)}
.arch-layer{display:grid;grid-template-columns:118px 1fr;gap:18px;align-items:center;padding:10px 0;position:relative}
.arch-tag{font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:1px;color:#fff;border-radius:8px;padding:8px 6px;text-align:center;line-height:1.5;z-index:1}
.arch-tag small{display:block;font-size:8.5px;opacity:.8;font-weight:400}
.arch-nodes{display:flex;flex-wrap:wrap;gap:6px}
.arch-nodes i{font-style:normal;font-size:11.5px;font-weight:500;padding:6px 11px;background:var(--surface);border:1px solid var(--line);border-radius:7px;color:var(--ink);transition:.2s}
.arch-nodes i:hover{transform:translateY(-2px);border-color:var(--acc);color:var(--acc);box-shadow:0 6px 14px -8px color-mix(in srgb,var(--acc) 40%,transparent)}
.l4 .arch-tag{background:var(--pink)}.l3 .arch-tag{background:var(--purple)}.l2 .arch-tag{background:var(--blue)}.l1 .arch-tag{background:var(--green)}.l0 .arch-tag{background:#475569}

/* reveal */
.reveal{opacity:0;transform:translateY(20px);transition:opacity .6s ease,transform .6s cubic-bezier(.2,.8,.2,1)}
.reveal.in{opacity:1;transform:none}

/* footer */
.foot{margin-top:48px;padding:24px 0 10px;border-top:1px solid var(--line)}
.foot-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:32px;margin-bottom:18px}
.foot h6{font-family:var(--mono);font-size:10px;letter-spacing:1.5px;color:var(--ink3);margin-bottom:8px;text-transform:uppercase;display:flex;align-items:center;gap:6px}
.foot h6 small{font-weight:500;font-size:9px;color:var(--ink3);opacity:.7;letter-spacing:1px}
.foot a{display:block;font-size:12.5px;color:var(--ink2);padding:2px 0;transition:.18s}
.foot a:hover{color:var(--green-d);transform:translateX(3px)}
.foot-note{font-family:var(--mono);font-size:10px;color:var(--ink3);border-top:1px dashed var(--line);padding-top:14px;line-height:1.9}

/* totop */
.totop{position:fixed;right:20px;bottom:24px;width:42px;height:42px;border-radius:11px;background:var(--surface);color:var(--green-d);font-size:16px;z-index:100;opacity:0;pointer-events:none;transition:.3s;box-shadow:0 8px 22px -10px rgba(15,23,42,.25);border:1px solid var(--line)}
.totop.on{opacity:1;pointer-events:auto}
.totop:hover{background:var(--green);color:#fff;transform:translateY(-3px)}

/* responsive */
@media (max-width:1080px){
  .topbar{display:flex}
  .layout{grid-template-columns:1fr}
  .side{position:fixed;top:0;left:0;bottom:0;width:280px;height:100vh;z-index:115;transform:translateX(-102%);transition:transform .35s cubic-bezier(.4,0,.2,1);box-shadow:20px 0 60px -20px rgba(15,23,42,.4);padding-top:70px}
  .side.open{transform:none}
  .main{padding:64px 20px 50px}
  .mast{grid-template-columns:1fr;padding-top:24px;gap:24px}
  .hero-term{min-height:280px}
  .stats{grid-template-columns:repeat(2,1fr)}
  .stat:nth-child(2n+1){border-left:none}
  .stat:nth-child(n+3){border-top:1px solid var(--line)}
  .rank{grid-template-columns:1fr}
  .flow{grid-template-columns:1fr}
  .flow-arr{min-width:0;padding:2px 0}
  .flow-arr i{background:repeating-linear-gradient(180deg,var(--acc) 0 6px,transparent 6px 11px)}
  .arch::before{display:none}
  .arch-layer{grid-template-columns:1fr;gap:8px}
  .arch-tag{max-width:140px}
}
@media (max-width:900px){
  .top10-grid{grid-template-columns:1fr}
}
@media (max-width:640px){
  .sec:not(:first-child){margin-top:44px}
  .sec-head{padding-left:12px;margin-bottom:20px}
  .stats{grid-template-columns:repeat(2,1fr);gap:10px}
  .stat{padding:13px 14px}
  .stat{border-left:none !important}
  .stat:nth-child(n+3){border-top:1px solid var(--line)}
  .stat:nth-child(-n+2){border-top:none}
  .tool-head{grid-template-columns:auto 1fr auto;gap:10px}
  .chips{display:none}
  .d-row{grid-template-columns:1fr;gap:4px}
  .d-row .arr{transform:rotate(90deg);justify-self:start}
  .sec-head{gap:10px}
  .rb{grid-template-columns:76px 1fr 26px}
  .top10 li{grid-template-columns:28px 1fr;gap:8px}
  .rk-tag{display:none}

  /* === 移动端兼容性修复 === */
  /* 1. 代码块: 允许长行换行,避免横向溢出 */
  .code pre{white-space:pre-wrap;word-break:break-word;overflow-x:hidden}
  .code code{white-space:pre-wrap;word-break:break-word;font-size:11.8px}
  /* 2. 表格: 缩小 min-width,降低横向滚动区域 */
  table{min-width:480px}
  .tbl-wrap{border-radius:10px}
  th,td{padding:9px 10px}
  /* 3. casebox 与子区域: 文字不溢出 */
  .casebox, .sub p, .sub ul li{overflow-wrap:anywhere;word-break:break-word}
  .verdict p, .verdict h4{overflow-wrap:anywhere}
  /* 4. 板块编号缩小, 避免与标题冲突 */
  .sec-num{font-size:clamp(34px,4.5vw,44px);letter-spacing:-1px;line-height:.9}
  .sec-tt h2{font-size:18px}
  .sec-head{flex-wrap:wrap}
  /* 5. 决策表: 单列下用下行箭头,更直观 */
  .d-row{grid-template-columns:1fr;gap:6px;padding:14px 16px}
  .d-row .arr{transform:none;justify-self:start;color:var(--acc);font-weight:600;display:flex;align-items:center;gap:4px;font-size:0;line-height:1}
  .d-row .arr svg{display:none}
  .d-row .arr::before{content:"\2193";font-size:16px;line-height:1}
  .d-row .need{color:var(--ink2);font-size:13px;line-height:1.6}
  .d-row .pick{color:var(--ink);font-size:13.5px;line-height:1.65}
  /* 6. 顶栏 z-index 修正,避免与内容层叠 */
  .topbar{z-index:130}
  /* 7. stats 数字视觉优化: 缩小数字字号 */
  .stat .num{font-size:24px}
  /* 8. tool pad 缩小 */
  .tool-pad{padding:4px 14px 18px}
  .tool-head{padding:12px 14px;gap:10px}
  .tool-ico{width:38px;height:38px;font-size:13px}
  /* 9. 标题与 lede 字号 */
  .mast h1{font-size:clamp(26px,6vw,36px);line-height:1.32}
  .lede{font-size:14px}
  .hero-term{min-height:240px}
  .term-body{min-height:170px;font-size:12px;padding:14px 16px 4px}
  .term{padding-bottom:18px}
  /* 10. mast-badges 紧凑 */
  .mast-badges{gap:8px;margin-top:18px}
  .mast-badges i{font-size:11px;padding:6px 12px}
  /* 11. rank 条目紧凑 */
  .rank-card{padding:12px 14px}
  .rb{grid-template-columns:72px 1fr 24px;margin-bottom:6px;font-size:12px}
  /* 12. footer 紧凑 */
  .foot{margin-top:36px;padding:18px 0 8px}
  .foot-grid{grid-template-columns:1fr;gap:18px}
  .foot h6{font-size:9.5px;margin-bottom:6px}
  .foot a{font-size:12px}
  /* 13. 防止页面整体水平滚动 */
  body{overflow-x:hidden}
  /* 14. 副标题描述在板块头不溢出 */
  .sec-tt p{font-size:12px;line-height:1.6}
  /* 15. 表格 6 列时,降低字号 */
  th, td{font-size:12.5px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .reveal{opacity:1;transform:none}
  .rank .rb .track i{width:var(--w)}
}
</style>
</head>

  <div class="tb-brand">AI <em>工具</em>全景图</div>
</header>
<div class="scrim" id="scrim"></div>
<div class="layout">

    <input id="q" type="search" placeholder="搜索工具 / 命令 / 场景…" autocomplete="off">

  <span class="qcount" id="qcount"></span>
  <nav class="nav" id="nav"></nav>

</aside>
<main class="main">

  <div>

    <h1>AI 工具全景图<br>从编程助手到<span class="hl">能力全景</span></h1>
    <p class="lede" id="lede"></p>
    <div class="mast-badges">
      <i><span class="tick">▣</span> <b>可折叠</b> 卡片</i><i><span class="tick">▣</span> <b>命令</b> 一键复制</i><i><span class="tick">▣</span> <b>TOP 10</b> 榜单</i><i><span class="tick">▣</span> <b>移动端</b> 自适应</i>
    </div>
  </div>
  <div class="hero-term">
    <div class="term">
      <div class="term-bar"><i></i><i></i><i></i><em>ai-stack — zsh</em></div>
      <div class="term-body" id="tl"></div>
    </div>

</section>
<div class="stats" id="stats"></div>
<div id="main-sections"></div>
<footer class="foot">
  <div class="foot-grid">
    <div><h6>板块索引</h6><div id="foot-index-a"></div></div>
    <div><h6>板块索引 <small>· CONT</small></h6><div id="foot-index-b"></div></div>
    <div><h6>关于</h6><a href="#">更新于 2026-08-21</a><a href="#">价格与参数以官方为准</a><a href="#">按 / 聚焦搜索</a></div>
  </div>
  <p class="foot-note">AI 工具全景图 · AI TOOLKIT MAP 2026 —— Built with ♥ and a lot of tokens.</p>
</footer>
</main>

  const subs = `<div class="sub"><h5>📖 介绍</h5><p>${esc(t.intro)}</p></div>` +
    (t.config ? `<div class="sub"><h5>⚙️ 配置指导</h5>${cfgBlocks(t.config)}</div>` : '') +
    `<div class="sub"><h5>🎯 实战案例</h5><div class="casebox"><p>${esc(t.case)}</p></div></div>`;
  return `<article class="tool reveal" data-search="${esc(t.search)}">
    <button class="tool-head" aria-expanded="false">
      <span class="tool-ico">${esc(t.ico)}</span>
      <span class="tool-name">${esc(t.name)}<em>${esc(t.sub)}</em></span>
      <span class="chips">${chips}</span>
      <span class="chev">›</span>
    </button>
    <div class="tool-body"><div class="tool-inner"><div class="tool-pad">${subs}</div></div></div>
  </article>`;
}

function tableHTML(tbl){
  if (!tbl) return '';
  const th = tbl.head.map(h=>`<th>${esc(h)}</th>`).join('');
  const trs = tbl.rows.map(r=>`<tr>${r.map((c,i)=>`<td>${i===0?`<b>${esc(c)}</b>`:esc(c)}</td>`).join('')}</tr>`).join('');
  return `<div class="tbl-wrap reveal"><table><thead><tr>${th}</tr></thead><tbody>${trs}</tbody></table></div><p class="tbl-cap">${esc(tbl.cap)}</p>`;
}
function decideHTML(d){
  if (!d) return '';
  const rows = d.rows.map(r=>`<div class="d-row"><span class="need">${esc(r.need)}</span><span class="arr"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h18"/><path d="M14 6l6 6-6 6"/></svg></span><span class="pick">${r.pick}</span></div>`).join('');
  return `<div class="decide reveal"><div class="decide-h">▚ ${esc(d.title)}</div>${rows}</div>`;
}
function verdictHTML(v){
  if (!v) return '';
  return `<div class="verdict reveal"><h4>▚ ${esc(v.title)}</h4>${v.paras.map(p=>`<p>${p}</p>`).join('')}</div>`;
}
function rankHTML(r){
  if (!r) return '';
  const cards = r.cards.map(c=>{
    const rows = c.rows.map((x,i)=>`<div class="rb m${Math.min(i+1,3)}"><b>${esc(x.name)}</b><span class="track"><i style="--w:${x.score}%" data-w="${x.score}"></i></span><em>${x.score}</em></div>`).join('');
    return `<div class="rank-card"><h4>${esc(c.title)} <i>${esc(c.en)}</i></h4>${rows}</div>`;
  }).join('');
  return `<div class="rank reveal" id="rank">${cards}</div><p class="tbl-cap">${esc(r.cap)}</p>`;
}
function top10HTML(t){
  if (!t) return '';
  const cols = t.cols.map(c=>{
    const items = c.items.map((it,i)=>`<li class="${i<3?`r${i+1}`:''}"><span class="rk">${String(it.no).padStart(2,'0')}</span><div class="rk-body"><b>${esc(it.name)}</b><em>${esc(it.desc)}</em><code data-copy="${esc(it.cmd)}">${esc(it.cmd)}</code></div><span class="rk-tag">${esc(it.tag)}</span></li>`).join('');
    let note = esc(c.note);
    const m = note.match(/(claude mcp add[^,。]*|git clone \S+)/);
    let noteHTML = note;
    if (m && m.index > 0) noteHTML = note.slice(0, m.index) + `<code data-copy="${esc(m[0])}">${esc(m[0])}</code>` + note.slice(m.index + m[0].length);
    return `<div class="top10-col reveal"><div class="top10-h">${esc(c.title)} <small>${esc(c.small)}</small></div><ol class="top10">${items}</ol><div class="top10-note">${noteHTML}</div></div>`;
  }).join('');
  return `<div class="top10-grid">${cols}</div><p class="tbl-cap">${esc(t.cap)}</p>`;
}
function archHTML(a){
  if (!a) return '';
  const layers = a.layers.map(l=>`<div class="arch-layer ${esc(l.cls)}"><div class="arch-tag">${esc(l.tag)}<small>${esc(l.en)}</small></div><div class="arch-nodes">${l.nodes.map(n=>`<i>${esc(n)}</i>`).join('')}</div></div>`).join('');
  return `<div class="reveal"><div class="decide-h" style="border:1px solid var(--line);border-radius:13px 13px 0 0;box-shadow:0 6px 18px -12px rgba(15,23,42,.08)">▚ 完整能力栈架构图 · THE FULL STACK</div><div class="arch" style="border:1px solid var(--line);border-top:none;border-radius:0 0 13px 13px;background:var(--surface);padding:16px 20px;box-shadow:0 6px 18px -12px rgba(15,23,42,.08)">${layers}</div></div>`;
}

function render(){
  $('#nav').innerHTML = `
    <div class="nav-label">板块</div>
    ${DATA.map(s=>`<a href="#${s.id}"><span class="n">${s.num}</span>${esc(s.title)}</a>`).join('')}
  `;
  $('#side-foot').innerHTML = `
    <b>●</b> ${esc(META.updated)} 更新<br>${DATA.length} 大板块 · ${META.tools} 款工具<br>持续探索最佳实践
    <button class="theme-toggle" id="themeToggle" role="switch" aria-checked="false" aria-label="切换主题">
      <span class="tt-lab"><span class="tt-ico">☀</span>深色模式</span>
      <span class="switch"></span>
    </button>
  `;
  $('#kicker').innerHTML = `<span class="dot"></span>AI TOOLKIT MAP · UPDATED ${META.updated}`;
  $('#lede').innerHTML = `${DATA.length} 大板块、${META.tools} 款工具，每一款都按「介绍 → 配置 / 使用指导 → 实战案例」三段式拆解，外加选型决策表、六维能力排行、MCP / Skills 双 TOP 10 清单与一张完整的能力栈架构图。按 <code>/</code> 可随时检索任意工具。`;
  $('#stats').innerHTML = [
    [DATA.length, '', '核心板块', 'TRACKS'],
    [META.tools, '', '收录工具', 'TOOLS'],
    [META.cmds, '+', '可执行命令', 'COMMANDS'],
    [META.cases, '+', '实战案例', 'CASES']
  ].map((x,i)=>{
    const [n, suf, zh, en] = x;
    return `<div class="stat s${i+1}">
      <div class="stat-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${STATS_ICONS[i]}</svg></div>
      <div class="stat-body">
        <div class="num" data-n="${n}" data-suf="${suf}">0</div>
        <div class="lab">${zh} <b>${en}</b></div>
      </div>
    </div>`;
  }).join('');

  $('#main-sections').innerHTML = DATA.map(s=>{
    const c = COLORS[s.id] || '#10b981';
    const tools = s.tools.map(t=>toolCard(t)).join('');
    return `<section class="sec card s${s.num[1]}" id="${s.id}" style="--acc:${c}">
      <header class="sec-head reveal">
        <div class="sec-num">${s.num}</div>
        <div class="sec-tt">
          <div><h2>${esc(s.title)} <span class="tag">${esc(TAGS[s.id]||'')}</span></h2><p>${esc(s.desc)}</p></div>
        </div>
        <div class="sec-ctrl">
          <button class="expand-toggle" data-action="expand" aria-label="全部展开">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
            <span>全部展开</span>
          </button>
          <button class="expand-toggle" data-action="collapse" aria-label="全部折叠">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
            <span>全部折叠</span>
          </button>
        </div>
      </header>
      ${s.id === 'eco'
        ? `${tools}${top10HTML(s.top10)}${tableHTML(s.table)}${archHTML(s.arch)}${verdictHTML(s.verdict)}`
        : `${tools}${tableHTML(s.table)}${decideHTML(s.decide)}${rankHTML(s.rank)}${top10HTML(s.top10)}${verdictHTML(s.verdict)}${archHTML(s.arch)}`}
    </section>`;
  }).join('');

  const indexLinks = DATA.map(s=>`<a href="#${s.id}">${s.num} · ${esc(s.title)}</a>`);
  const half = Math.ceil(indexLinks.length / 2);
  $('#foot-index-a').innerHTML = indexLinks.slice(0, half).join('');
  $('#foot-index-b').innerHTML = indexLinks.slice(half).join('');

  syncAll();
}

const META = { version: '2.8', updated: '2026-08-21',
  tools: DATA.reduce((a,s)=>a+s.tools.length,0),
  cmds:  DATA.reduce((a,s)=>a+s.tools.reduce((x,t)=>x+t.config.filter(b=>b.type==='code').length,0),0),
  cases: DATA.reduce((a,s)=>a+s.tools.length,0) };

function syncHead(t){ t.querySelector('.tool-head').setAttribute('aria-expanded', t.classList.contains('open')); }
function syncAll(){ $$('.tool').forEach(syncHead); }

document.addEventListener('click', e=>{
  const head = e.target.closest('.tool-head');
  if (head){ const t=head.closest('.tool'); t.classList.toggle('open'); syncHead(t); return; }
  const c = e.target.closest('[data-copy], .copy');
  if (c){ copyText(c.dataset.copy || c.closest('.code').querySelector('code').innerText, c); return; }
  const et = e.target.closest('.expand-toggle');
  if (et){
    const sec = et.closest('section');
    const expand = et.dataset.action === 'expand';
    sec.classList.toggle('open', expand);
    sec.querySelectorAll('.tool').forEach(t=>t.classList.toggle('open', expand));
    syncAll();
  }
});

async function copyText(text, btn){
  try { await navigator.clipboard.writeText(text); }
  catch(e){ const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); }
  const old = btn.textContent; btn.textContent = '✓';
  setTimeout(()=>{ btn.textContent = old; btn.classList.remove('copied'); }, 1200);
}

const io = new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } }), {threshold:.1});
const rio = new IntersectionObserver(es=>es.forEach(e=>{
  if(!e.isIntersecting) return;
  const target = e.target;
  target.classList.add('go');
  rio.unobserve(target);
}), {threshold:.05, rootMargin:'0px 0px -40px 0px'});
const sio = new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){ e.target.querySelectorAll('.num').forEach(countUp); sio.unobserve(e.target); } }), {threshold:.4});
const spy = new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){ const id='#'+e.target.id; $$('.nav a').forEach(a=>a.classList.toggle('act', a.getAttribute('href')===id)); } }), {rootMargin:'-25% 0px -60% 0px'});

function countUp(el){
  const n = +el.dataset.n, suf = el.dataset.suf||'', t0 = performance.now(), d = 1200;
  (function f(t){ const p = Math.min(1,(t-t0)/d); const e = p<.5 ? 2*p*p : -1+(4-2*p)*p;
    el.textContent = String(Math.round(n*e)) + suf;
    if (p<1) requestAnimationFrame(f); })(t0);
}

/* 终端打字机 */
const TL = [
  {t:'ai-stack init --year 2026', c:'cmd'},
  {t:`✔ ${DATA.length} 个板块加载完成 · ${META.tools} 款工具注册`, c:'ok'},
  {t:`✔ ${META.cmds}+ 条配置命令已验证`, c:'ok'},
  {t:'✔ MCP / Skills 双 TOP 10 已装填', c:'ok'},
  {t:'→ Ready. 向下滚动浏览，或按 / 搜索', c:'go'}
];
const box = $('#tl');
(async()=>{
  if (reduce){ TL.forEach(l=>{ const d=document.createElement('div'); d.className='tl '+l.c; d.textContent=l.t; box.appendChild(d); }); }
  else {
    for (const l of TL){
      const d = document.createElement('div'); d.className='tl '+l.c; box.appendChild(d);
      for (let i=0;i<=l.t.length;i++){ d.textContent = l.t.slice(0,i); await new Promise(r=>setTimeout(r, l.c==='cmd'?36:12)); }
      await new Promise(r=>setTimeout(r,300));
    }
  }
  const cur = document.createElement('span'); cur.className='cur'; box.appendChild(cur);
})();

const prog = $('#progress'), totop = $('#totop');
addEventListener('scroll', ()=>{
  const h = document.documentElement, p = h.scrollTop/(h.scrollHeight-h.clientHeight);
  prog.style.width = (p*100)+'%';
  const show = h.scrollTop>500;
  totop.classList.toggle('on', show);
  totop.setAttribute('aria-hidden', String(!show));
  totop.tabIndex = show ? 0 : -1;
}, {passive:true});
totop.addEventListener('click', ()=>scrollTo({top:0, behavior: reduce?'auto':'smooth'}));

const burger = $('#burger'), side = $('#side'), scrim = $('#scrim');
function toggleSide(v){ side.classList.toggle('open', v); scrim.classList.toggle('on', v); }
burger.addEventListener('click', ()=>toggleSide(!side.classList.contains('open')));
scrim.addEventListener('click', ()=>toggleSide(false));
$$('.nav a').forEach(a=>a.addEventListener('click', ()=>{ if(innerWidth<=1080) toggleSide(false); }));

const q = $('#q'), qc = $('#qcount'); let auto = new Set();
q.addEventListener('input', ()=>{
  const v = q.value.trim().toLowerCase(); let n = 0;
  $$('.tool').forEach(t=>{
    const hay = ((t.dataset.search||'')+' '+t.textContent).toLowerCase();
    const hit = !v || hay.includes(v);
    t.classList.toggle('hide', !!v && !hit);
    if (v && hit){ n++; if(!t.classList.contains('open')){ t.classList.add('open'); syncHead(t); auto.add(t); } }
  });
  qc.textContent = v ? `▸ ${n} 个匹配结果` : '';
  if (!v){ auto.forEach(t=>{ t.classList.remove('open'); syncHead(t); }); auto.clear(); }
});
addEventListener('keydown', e=>{
  const ae = document.activeElement;
  const editable = ae && (ae.tagName==='INPUT' || ae.tagName==='TEXTAREA' || ae.tagName==='SELECT' || ae.isContentEditable);
  if (e.key==='/' && !editable){ e.preventDefault(); q.focus(); if(innerWidth<=1080) toggleSide(true); }
  if (e.key==='Escape'){ q.value=''; q.dispatchEvent(new Event('input')); q.blur(); }
});

/* 深色模式切换 */
const rootEl = document.documentElement, THEME_KEY = 'ai-toolkit-map-theme';
function applyTheme(t){
  rootEl.setAttribute('data-theme', t);
  const toggler = $('#themeToggle');
  if (toggler) toggler.setAttribute('aria-checked', t==='dark');
  try { localStorage.setItem(THEME_KEY, t); } catch(e){}
}
const savedTheme = (() => { try { return localStorage.getItem(THEME_KEY); } catch(e){ return null; } })();
applyTheme(savedTheme === 'dark' || (savedTheme === null && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light');

render();
$$('.reveal').forEach(el=>io.observe(el));
const rankEl = $('#rank'); if (rankEl) rio.observe(rankEl);
const statsEl = $('#stats'); if (statsEl) sio.observe(statsEl);
$$('.sec').forEach(s=>spy.observe(s));

/* 主题切换按钮事件（需在 render 之后绑定） */
(function bindThemeToggle(){
  const toggler = $('#themeToggle');
  if (!toggler) return;
  toggler.addEventListener('click', ()=>{
    applyTheme(rootEl.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
  });
})();
</script>
</body>
</html>
