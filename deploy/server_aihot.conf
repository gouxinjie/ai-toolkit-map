# ============================================================
# 站点：aihot.gouxinjie.com  (AI 工具全景图)
# 说明：纯前端静态站点，使用 HTTP(80) 协议
# 与 ECS 上其他项目共存于同一 Nginx(监听 80 端口)，通过
# server_name 区分不同域名，互不影响。
#
# 部署位置：
#   复制本文件到 /etc/nginx/conf.d/server_aihot.conf
#   然后执行：nginx -t && nginx -s reload
# ============================================================

server {
    listen       80;
    # 监听所有网卡 80 端口（与其他项目共用 80，通过 server_name 区分）
    server_name  aihot.gouxinjie.com;

    root   /var/www/ai-toolkit-map;
    index  index.html;

    # 站点首页
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存（js/css/图片/字体）
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|webp|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
    }

    # 访问日志
    access_log  /var/log/nginx/aihot.gouxinjie.com.access.log;
    error_log   /var/log/nginx/aihot.gouxinjie.com.error.log;
}
